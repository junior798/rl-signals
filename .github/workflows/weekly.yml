name: Weekly signals

on:
  schedule:
    - cron: "17 11 * * 1"        # Mondays 11:17 UTC (6:17 am Montreal in winter)
  workflow_dispatch:              # "Run workflow" button in the Actions tab
    inputs:
      days:
        description: "How many days back to load (180 for the first run)"
        default: "21"
      sources:
        description: "all, or a list like seao,canadabuys"
        default: "all"
      dry_run:
        description: "true = save CSV files only, do not touch the sheet"
        default: "false"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: |
          DRY=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then DRY="--dry-run"; fi
          python -m rl_signals run --days "${{ inputs.days || '21' }}" --sources "${{ inputs.sources || 'all' }}" $DRY
      - name: Keep CSV copies of this run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output
          path: output/
          if-no-files-found: ignore
